<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marktplatz – ReadyToPublish</title>
  <meta name="description" content="Fertige Buchprojekte nach Genre, Umfang, Paket und Preis durchsuchen.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="browse">
<main>
  <div class="page-head">
    <div class="wrap">
      <p class="kicker">Marktplatz</p>
      <h1 class="display" style="margin-top:12px">Alle Buchprojekte</h1>
      <form class="search" id="searchForm" role="search">
        <input type="search" id="q" placeholder="Titel, Autor:in oder Stichwort" aria-label="Suche">
        <button type="submit">Suchen</button>
      </form>
    </div>
  </div>

  <div class="wrap market">
    <aside class="filters" id="filters" aria-label="Filter">
      <div class="filters__head">
        <h2>Filter</h2>
        <button class="filters__reset" id="reset" type="button">Zurücksetzen</button>
      </div>
      <div class="filter-group">
        <h3>Genre</h3>
        <div id="fGenre"></div>
      </div>
      <div class="filter-group">
        <h3>Paket</h3>
        <div id="fPackage"></div>
      </div>
      <div class="filter-group">
        <h3>Umfang</h3>
        <div id="fWords"></div>
      </div>
      <div class="filter-group">
        <h3>Preis in €</h3>
        <div class="price-inputs">
          <input class="input" type="number" id="pmin" placeholder="von" min="0" step="100" inputmode="numeric" aria-label="Mindestpreis">
          <input class="input" type="number" id="pmax" placeholder="bis" min="0" step="100" inputmode="numeric" aria-label="Höchstpreis">
        </div>
      </div>
      <button class="btn btn--block filters__close" id="closeFilters" type="button">Ergebnisse anzeigen</button>
    </aside>

    <section aria-live="polite">
      <div class="toolbar">
        <div class="toolbar__count" id="count"></div>
        <div class="toolbar__right">
          <button class="btn btn--ghost btn--sm filter-open" id="openFilters" type="button">Filter</button>
          <select class="select" id="sort" aria-label="Sortierung">
            <option value="empfohlen">Empfohlen</option>
            <option value="neu">Neueste zuerst</option>
            <option value="preis-auf">Preis aufsteigend</option>
            <option value="preis-ab">Preis absteigend</option>
          </select>
          <div class="view-switch" role="group" aria-label="Ansicht">
            <button type="button" data-view="grid" aria-pressed="true" title="Raster">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="6" height="6"/><rect x="9" y="1" width="6" height="6"/><rect x="1" y="9" width="6" height="6"/><rect x="9" y="9" width="6" height="6"/></svg>
            </button>
            <button type="button" data-view="list" aria-pressed="false" title="Liste">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="2" width="14" height="2"/><rect x="1" y="7" width="14" height="2"/><rect x="1" y="12" width="14" height="2"/></svg>
            </button>
          </div>
        </div>
      </div>
      <div class="chips" id="chips"></div>
      <div id="results"></div>
    </section>
  </div>
</main>

<script type="module" src="js/main.js"></script>
<script type="module" src="js/browse.js"></script>
</body>
</html>
